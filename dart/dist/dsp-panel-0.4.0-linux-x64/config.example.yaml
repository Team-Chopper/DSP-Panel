# DSP408 web panel – server configuration
# Installed as /etc/dsp-panel/config.yaml. Restart after changes:
#   sudo systemctl restart dsp-panel

listen:
  # 0.0.0.0 = all network interfaces
  address: 0.0.0.0
  # 443 also works (the service is allowed to bind privileged ports)
  port: 8443

tls:
  # HTTPS is required for the RTA microphone in the browser (except on localhost).
  enabled: true
  # install.sh creates a self-signed certificate here. Replace the files with
  # your own certificate to avoid the browser warning.
  cert: /var/lib/dsp-panel/tls/cert.pem
  key: /var/lib/dsp-panel/tls/key.pem

auth:
  # true: login with the panel password (set it with: sudo dsp-panel-passwd)
  # false: everyone who can reach the server can control the DSPs
  enabled: true

# DSP list, password hash and session key
data_dir: /var/lib/dsp-panel

# Flutter web client
web_root: /opt/dsp-panel/web
