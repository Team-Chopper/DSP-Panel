# DSP web panel (Rust) – server configuration
# Installed as /etc/dsp-panel-rs/config.yaml. Restart after changes:
#   sudo systemctl restart dsp-panel-rs
# Same format as the Dart server's /etc/dsp-panel/config.yaml.

listen:
  # 0.0.0.0 = all network interfaces
  address: 0.0.0.0
  # 8444 so it runs next to the Dart panel on 8443; 443 also works
  port: 8444

tls:
  # HTTPS is required for the RTA microphone in the browser (except on localhost).
  enabled: true
  # install.sh creates a self-signed certificate here (or imports the one of
  # the Dart installation). Replace the files with your own certificate to
  # avoid the browser warning.
  cert: /var/lib/dsp-panel-rs/tls/cert.pem
  key: /var/lib/dsp-panel-rs/tls/key.pem

auth:
  # true: login with the panel password (set it with: sudo dsp-panel-rs-passwd)
  # false: everyone who can reach the server can control the DSPs
  enabled: true

# DSP list, presets, password hash and session key
data_dir: /var/lib/dsp-panel-rs

# Web client
web_root: /opt/dsp-panel-rs/web
