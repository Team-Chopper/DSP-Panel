[workspace]
resolver = "3"
members = ["crates/dsp-core", "crates/fake-dsp", "crates/dsp-server", "crates/dsp-web"]

[workspace.package]
version = "1.0.0-alpha.2"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
dsp-core = { path = "crates/dsp-core" }
fake-dsp = { path = "crates/fake-dsp" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "macros", "sync", "signal", "io-util", "fs"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Web client (trunk, see crates/dsp-web/index.html): small download first.
[profile.web-release]
inherits = "release"
opt-level = "z"
lto = true

# The RTA FFT and the EQ curves stay at full speed.
[profile.web-release.package.dsp-core]
opt-level = 3
