<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limiter</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0d12; color: #e6e9ef; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vmin;
    user-select: none; -webkit-user-select: none;
  }
  #lamp {
    width: 62vmin; height: 62vmin; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: #1b1f29; border: 1.2vmin solid #2a3040; transition: background .5s, box-shadow .5s, border-color .5s;
  }
  #lamp span { font-size: 9vmin; font-weight: 800; letter-spacing: .08em; color: #5b6478; transition: color .5s; }
  body.on #lamp {
    background: radial-gradient(circle at 40% 35%, #ff6b6b, #c81e1e 70%); border-color: #ff8a8a;
    box-shadow: 0 0 12vmin 3vmin rgba(255, 40, 40, .55); transition: background .05s, box-shadow .05s, border-color .05s;
  }
  body.on #lamp span { color: #fff; transition: color .05s; }
  body.ok #lamp span { color: #4ade80; }
  #text { font-size: 4.2vmin; color: #8b93a7; text-align: center; padding: 0 6vmin; min-height: 1.3em; }
  body.on #text { color: #ffb4b4; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="lamp"><span id="word">—</span></div>
<div id="text">Connecting …</div>
<script>
  const body = document.body, word = document.getElementById("word"), text = document.getElementById("text");
  function show(state) {
    body.className = state.on ? "on" : state.ready ? "ok" : "";
    word.textContent = state.on ? "LIMIT" : state.ready ? "OK" : "—";
    text.textContent = state.on ? "The limiter is working – more gain won't help."
      : state.ready ? "" : "No limiter is being watched.";
  }
  function connect() {
    const events = new EventSource("/limit/events");
    events.onmessage = (e) => { try { show(JSON.parse(e.data)); } catch (_) {} };
    events.onerror = () => {
      body.className = ""; word.textContent = "—"; text.textContent = "No connection to the panel server.";
    };
  }
  connect();
  // Keep the screen on where the browser allows it.
  async function wake() { try { await navigator.wakeLock.request("screen"); } catch (_) {} }
  wake();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); });
</script>
</body>
</html>
