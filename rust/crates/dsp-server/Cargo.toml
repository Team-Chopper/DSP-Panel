[package]
name = "dsp-server"
description = "DSP panel server: TCP to the DSPs, WebSocket and static files for the web panel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "dsp-server"
path = "src/main.rs"

[dependencies]
dsp-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
indexmap = "2"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br"] }
tower = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
yaml-rust2 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
getrandom = "0.3"
rpassword = "7"

[dev-dependencies]
fake-dsp.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.26"
