[package]
name = "dsp-web"
description = "Web client of the DSP panel (Leptos, client-side rendered)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dsp-core.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "AudioBuffer",
  "AudioBufferSourceNode",
  "AudioContext",
  "AudioContextOptions",
  "AudioContextState",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "AudioScheduledSourceNode",
  "AudioWorklet",
  "AudioWorkletNode",
  "AudioWorkletNodeOptions",
  "BaseAudioContext",
  "BiquadFilterNode",
  "BiquadFilterType",
  "CanvasRenderingContext2d",
  "CloseEvent",
  "CssStyleDeclaration",
  "DomRect",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "GainNode",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "KeyboardEvent",
  "Location",
  "MediaDevices",
  "MediaDeviceInfo",
  "MediaDeviceKind",
  "MediaStream",
  "MediaStreamAudioSourceNode",
  "MediaStreamConstraints",
  "MediaStreamTrack",
  "MediaTrackConstraints",
  "MessageEvent",
  "MessagePort",
  "MouseEvent",
  "Navigator",
  "OscillatorNode",
  "OscillatorType",
  "Performance",
  "PointerEvent",
  "ResizeObserver",
  "ResizeObserverEntry",
  "Storage",
  "WebSocket",
  "WheelEvent",
  "Window",
  "Worker",
  "WorkerOptions",
  "WorkerType",
] }
